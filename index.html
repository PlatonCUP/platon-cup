<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>プラトンチャンピオンシップ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Zen+Kaku+Gothic+New:wght@700;900&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
body{margin:0}
/* Layout: 大会バー → 工程タブ(①〜④) → 作業パネル。マットの青と赤コーナーを色の芯にする運営ツール */
:root{
  --bg:#f7f8fb; --surface:#ffffff; --sunk:#e9edf4; --ink:#151d2e; --muted:#5a6578; --line:#d6dce6;
  --mat:#2250d6; --mat-ink:#ffffff; --mat-soft:#e6edfd;
  --red:#d42a3c; --red-soft:#fde8ea;
  --warn:#9a5b00; --warn-soft:#fcefd8; --ok:#1f8a4c; --ok-soft:#ddf3e6;
  --grad:linear-gradient(115deg,#d42a3c 0%,#8b3a9c 52%,#2250d6 100%);
  --shadow:0 1px 2px rgba(20,30,60,.06),0 6px 18px rgba(20,30,60,.06);
  --f-display:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif;
  --f-body:"BIZ UDPGothic","Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:10px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f141e; --surface:#171e2c; --sunk:#1e2738; --ink:#e6eaf2; --muted:#9ca6b8; --line:#2b3549;
  --mat:#7a9cff; --mat-ink:#0b1220; --mat-soft:#1b2747;
  --red:#ff6b7a; --red-soft:#3d1a22;
  --warn:#f0b257; --warn-soft:#382a12; --ok:#6fcf97; --ok-soft:#163223;
  --shadow:0 1px 2px rgba(0,0,0,.35);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0f141e; --surface:#171e2c; --sunk:#1e2738; --ink:#e6eaf2; --muted:#9ca6b8; --line:#2b3549;
  --mat:#7a9cff; --mat-ink:#0b1220; --mat-soft:#1b2747;
  --red:#ff6b7a; --red-soft:#3d1a22;
  --warn:#f0b257; --warn-soft:#382a12; --ok:#6fcf97; --ok-soft:#163223;
  --shadow:0 1px 2px rgba(0,0,0,.35);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6}
.wrap{max-width:1120px;margin:0 auto;padding-inline:16px;padding-block:20px 56px;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;line-height:1.3}
h1{font-size:1.45rem;font-weight:900;letter-spacing:.02em}
h2{font-size:1.15rem;font-weight:900}
h3{font-size:1rem;font-weight:700}
p{margin:0}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:.85rem}

/* header */
.top{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand svg{flex:none}
.brand .eyebrow{font-size:.72rem;letter-spacing:.14em;color:var(--muted);font-weight:700}
.tbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-left:auto}
select,input[type=text],textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0}
textarea{width:100%;min-height:140px;font-family:var(--f-num);font-size:.8rem;line-height:1.5;resize:vertical}
select:focus-visible,input:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--mat);outline-offset:2px}
button{font:inherit;font-weight:700;border-radius:8px;padding:8px 14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;white-space:nowrap}
button:hover:not(:disabled){border-color:var(--mat)}
button:disabled{opacity:.45;cursor:not-allowed}
button.primary{background:var(--mat);border-color:var(--mat);color:var(--mat-ink)}
button.primary:hover:not(:disabled){filter:brightness(1.08)}
button.danger{color:var(--red);border-color:var(--red)}
button.ghost{border-color:transparent;background:transparent;padding:6px 8px}
button.ghost:hover:not(:disabled){background:var(--sunk);border-color:transparent}

.banner{border-radius:var(--r);padding:10px 14px;font-size:.9rem;background:var(--warn-soft);color:var(--warn)}
.banner[data-kind=info]{background:var(--mat-soft);color:var(--mat)}

/* tabs: real sequence of the tournament workflow */
.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:2px solid var(--line)}
.tab{border:none;border-bottom:3px solid transparent;border-radius:8px 8px 0 0;background:transparent;padding:10px 14px;margin-bottom:-2px;color:var(--muted);display:flex;gap:8px;align-items:baseline}
.tab .step{font-family:var(--f-num);font-weight:600}
.tab[aria-selected=true]{color:var(--mat);border-bottom-color:var(--mat)}
.tab .soon{font-size:.72rem;font-weight:400}

.panel{display:flex;flex-direction:column;gap:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.row.between{justify-content:space-between}

/* weight-class summary strip */
.classes{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.cls{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.cls .w{font-family:var(--f-num);font-weight:600;font-size:1.05rem}
.cls .w small{font-size:.7rem;color:var(--muted);margin-left:2px}
.cls .n{font-size:.85rem}
.cls .fmt{font-size:.74rem;color:var(--muted);line-height:1.4}
.cls[data-empty=true]{opacity:.55}

.wtag{display:inline-flex;align-items:baseline;gap:1px;font-family:var(--f-num);font-weight:600;background:var(--mat);color:var(--mat-ink);border-radius:6px;padding:1px 8px;font-size:.9rem}
.wtag small{font-size:.65rem;opacity:.85}
.ace{display:inline-block;font-size:.7rem;font-weight:700;letter-spacing:.06em;color:var(--red);background:var(--red-soft);border-radius:999px;padding:0 8px;line-height:1.7}
.pill{display:inline-block;font-size:.75rem;font-weight:700;border-radius:999px;padding:1px 10px;background:var(--sunk);color:var(--muted)}
.pill[data-s=done]{background:var(--ok-soft);color:var(--ok)}
.pill[data-s=stale]{background:var(--warn-soft);color:var(--warn)}
.pill[data-s=locked]{background:var(--mat-soft);color:var(--mat)}

/* tables */
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:.75rem;color:var(--muted);font-weight:700;letter-spacing:.04em}
td.c,th.c{text-align:center}

.warnlist{margin:0;padding-left:1.2em;color:var(--warn);font-size:.88rem;display:flex;flex-direction:column;gap:2px}
.preview-stats{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:.9rem}
.preview-stats b{font-family:var(--f-num);font-size:1.1rem}

.addform{display:grid;grid-template-columns:2fr 2fr 1fr auto auto;gap:8px;align-items:center}
@media (max-width:640px){.addform{grid-template-columns:1fr 1fr}.addform button{grid-column:span 2}}
label.chk{display:inline-flex;gap:6px;align-items:center;font-size:.9rem;white-space:nowrap}

.rosterclass{display:flex;flex-direction:column;gap:6px}
.rosterclass + .rosterclass{border-top:1px dashed var(--line);padding-top:14px}

/* draw */
.drawclass{display:flex;flex-direction:column;gap:12px}
.pools{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.pool{border:1px solid var(--line);border-radius:var(--r);background:var(--bg);padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.pool header{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.pool .letter{font-family:var(--f-display);font-weight:900;font-size:1.1rem}
.pool ol{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px}
.pool li{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 8px;padding:6px 8px;background:var(--surface);border-radius:6px;border:1px solid transparent}
.pool li[data-clash=true]{border-color:var(--warn)}
.pool li .team{font-size:.78rem;color:var(--muted)}
.pool .poolwarn{font-size:.78rem;color:var(--warn)}
.empty{border:1px dashed var(--line);border-radius:var(--r);padding:28px 18px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}

.toast{white-space:pre-line;position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:.9rem;max-width:calc(100% - 32px);z-index:5}
@media (prefers-reduced-motion:no-preference){.toast{animation:pop .2s ease-out}@keyframes pop{from{opacity:.4;transform:translate(-50%,6px)}to{opacity:1;transform:translate(-50%,0)}}}
.mrow{display:grid;grid-template-columns:150px 1fr;gap:10px 16px;padding-block:12px;border-top:1px solid var(--line)}
.mrow:first-of-type{border-top:none}
.mrow .who{display:flex;flex-direction:column;gap:4px}
.opts{display:flex;flex-direction:column;gap:6px;min-width:0}
.opt{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;align-items:start;padding:8px 10px;border:1px solid var(--line);border-radius:8px;cursor:pointer;background:var(--surface)}
.opt:has(input:checked){border-color:var(--mat);background:var(--mat-soft)}
.opt[aria-disabled=true]{opacity:.5;cursor:not-allowed}
.opt input{margin-top:4px}
.opt .t{font-weight:700}
.opt .d{grid-column:2;font-size:.82rem;color:var(--muted)}
.ok{color:var(--ok);font-weight:700}
.ng{color:var(--warn);font-weight:700}
.rec{display:inline-block;font-size:.7rem;font-weight:700;color:var(--mat);border:1px solid var(--mat);border-radius:999px;padding:0 7px;margin-left:6px;line-height:1.6}
.cls .fmt .ng,.cls .fmt .ok{font-weight:700}
.stage2{display:flex;flex-direction:column;gap:4px;font-size:.86rem;background:var(--bg);border-radius:8px;padding:10px 12px}
.stage2 b{font-family:var(--f-display)}
.blockhead{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sub + .sub{border-top:1px dashed var(--line);padding-top:12px}
@media (max-width:560px){.mrow{grid-template-columns:1fr}}
.sumfig{display:flex;flex-direction:column;align-items:flex-end;gap:0}
.sumfig b{font-size:1.6rem;line-height:1.2}
.sumfig b.over{color:var(--red)}
.settings{gap:10px 18px}
.settings input[type=number]{width:5.5em}
.settings input,.fmtbody select{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 8px}
.fmted{border:1px solid var(--line);border-radius:8px;padding:8px 12px;background:var(--bg)}
.fmtbody{display:flex;flex-direction:column;gap:10px;margin-top:10px;align-items:flex-start}
.placechecks{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center}
.nowrap{white-space:nowrap}
td select{font-size:.85rem;padding:4px 6px}
tr.wdrow td{color:var(--muted);text-decoration:line-through}
tr.wdrow td:last-child{text-decoration:none}
.figs{gap:10px 28px}
.sumfig.left{align-items:flex-start}
table.order td{vertical-align:top}
table.order td .team{display:block;font-size:.74rem;color:var(--muted)}
table.order tr.pm td{background:var(--mat-soft)}
table.order .slot{font-weight:700;color:var(--mat)}
.corner{display:inline-block;width:.7em;height:.7em;border-radius:50%;margin-right:4px;vertical-align:baseline}
.corner.red{background:var(--red)}.corner.blue{background:var(--mat)}
td.lowgap{color:var(--warn);font-weight:700;background:var(--warn-soft)}
.filters{gap:8px 18px}
.filters input[type=text]{width:12em}
#setGap{width:4.5em;font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 8px}
.rlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
.rcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.rcard.done{background:var(--bg)}
.rmeta{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:.8rem;color:var(--muted);font-weight:700}
.rvs{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center}
.rside{border-radius:8px;padding:8px 10px;min-width:0;border-left:5px solid}
.rside.red{border-color:var(--red);background:var(--red-soft)}
.rside.blue{border-color:var(--mat);background:var(--mat-soft)}
.rside .team{display:block;font-size:.74rem;color:var(--muted)}
.rside .slot{font-weight:700}
.vs{font-size:.8rem;color:var(--muted)}
.rres{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;justify-content:space-between;font-size:.88rem}
.rform{display:flex;flex-direction:column;gap:8px;border-top:1px dashed var(--line);padding-top:10px}
.rform input[type=number]{width:4.5em}
.rform input,.rform select{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 8px}
.wbtn.red.on{background:var(--red);border-color:var(--red);color:#fff}
.wbtn.blue.on{background:var(--mat);border-color:var(--mat);color:var(--mat-ink)}
button.small{padding:5px 10px;font-size:.85rem}
h2.sect{margin-top:8px}
table.stand caption{text-align:left;font-weight:700;padding:6px 0;font-size:.9rem}
table.stand .team{display:block;font-size:.72rem;color:var(--muted)}
.medals{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:8px}
.medals li{display:flex;flex-direction:column;padding:8px 14px;border-radius:8px;background:var(--sunk);min-width:140px}
.medals li.m1{background:var(--warn-soft)}
.medals .pos{font-family:var(--f-display);font-weight:900;font-size:.85rem;color:var(--muted)}
.medals .team{font-size:.75rem;color:var(--muted)}
table.order tr[data-done] td{color:var(--muted)}
.tab.view{margin-left:auto;border-left:1px solid var(--line);border-radius:0;padding-left:16px}
.clstabs{display:flex;gap:4px;overflow-x:auto;background:var(--sunk);border-radius:10px;padding:4px}
.ctab{flex:1 0 auto;border:none;background:transparent;border-radius:8px;padding:6px 12px;font-family:var(--f-num);font-weight:600;color:var(--muted);display:inline-flex;gap:6px;align-items:baseline}
.ctab small{font-size:.65rem}
.ctab .cn{font-size:.7rem;color:var(--muted);font-weight:500}
.ctab[aria-selected=true]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.pcard{border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:6px;background:var(--surface);min-width:0}
.pcard .ptop{display:flex;justify-content:space-between;align-items:center;gap:8px}
.pcard .team{font-size:.8rem;color:var(--muted)}
.pstats{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center}
.pill.plan{background:var(--mat-soft);color:var(--mat)}
.rec{font-weight:700}
.pfoot{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:.82rem;min-height:1.4em}
.next b{color:var(--mat)}
.place{font-family:var(--f-display);font-weight:900}
.pcard.medal.m1{border-color:var(--warn);background:var(--warn-soft)}
.pcard.medal.m2,.pcard.medal.m3{border-color:var(--mat)}
.pcard.wd{opacity:.6}
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px}
.chip{border:1px solid var(--line);border-radius:8px;padding:8px 10px;display:flex;flex-wrap:wrap;gap:2px 6px;align-items:baseline;min-width:0}
.chip small{flex-basis:100%;font-size:.75rem;color:var(--muted)}
.chip.wd{opacity:.5}
.chip.wd b{text-decoration:line-through}
.star{color:#d99a00;margin-left:3px;font-size:.85em}
.grp{display:flex;flex-direction:column;gap:8px;padding-block:6px}
.grp + .grp{border-top:1px dashed var(--line);padding-top:14px}
.gbadge{align-self:flex-start;font-size:.8rem;font-weight:700;color:var(--mat);border:1px solid var(--mat);border-radius:6px;padding:1px 10px}
h3.sub{font-size:.85rem;color:var(--muted)}
.vslist{display:flex;flex-direction:column;gap:6px}
.vsrow{display:grid;grid-template-columns:56px 1fr auto 1fr auto auto;gap:8px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-size:.88rem}
.vsrow .no{font-size:.75rem;color:var(--muted)}
.vsrow .sd.blue{text-align:right}
.vsrow .rs{font-size:.78rem;color:var(--muted);white-space:nowrap}
.who{display:inline-flex;flex-direction:column;min-width:0}
.vsrow .sd.blue .who{align-items:flex-end}
.who small{font-size:.72rem;color:var(--muted)}
.who.win{font-weight:700}
.who.slot{font-weight:700;color:var(--mat)}
.vsx{font-size:.75rem;color:var(--muted);font-weight:700;text-align:center}
@media (max-width:640px){.vsrow{grid-template-columns:1fr auto 1fr;}.vsrow .no,.vsrow .rs{grid-column:1/-1}.vsrow .pill{grid-column:1/-1;justify-self:start}}
.bigs{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;margin-bottom:12px}
.bigmatch{display:flex;flex-direction:column;gap:6px}
.bmhead{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.bigside{border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:var(--bg);display:flex;justify-content:space-between;align-items:center;gap:8px;border-left:5px solid}
.bigside.red{border-left-color:var(--red)}.bigside.blue{border-left-color:var(--mat)}
.bigside.win{background:var(--mat);border-color:var(--mat);color:var(--mat-ink)}
.bigside.win small{color:inherit;opacity:.85}
.wintag{font-size:.75rem;font-weight:700;border:1px solid currentColor;border-radius:6px;padding:0 8px}
a.btnlink{display:inline-block;font-weight:700;border-radius:8px;padding:10px 18px;text-decoration:none}
a.btnlink.primary{background:var(--mat);color:var(--mat-ink)}
a.btnlink:focus-visible{outline:2px solid var(--mat);outline-offset:2px}
.photo .url{word-break:break-all}
.howto{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.howto>div{background:var(--bg);border-radius:8px;padding:12px 14px}
.howto ol{margin:6px 0;padding-left:1.3em;font-size:.9rem}
body.viewer .adminonly{display:none!important}
.urls{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.urls>div{background:var(--bg);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;align-items:flex-start;min-width:0}
.urls .url{word-break:break-all;font-size:.82rem;margin:0}
.finals{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.fcard{gap:10px}
.podium{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.podium li{display:flex;gap:12px;align-items:center;padding:8px 10px;border-radius:8px;background:var(--bg)}
.podium li.p1{background:var(--warn-soft)}
.podium .pos{font-family:var(--f-display);font-weight:900;font-size:1.3rem;width:1.4em;text-align:center}
.podium li.p1 .pos{color:var(--warn)}
.podium .pn{display:flex;flex-direction:column;min-width:0}
.podium .pn small{font-size:.75rem;color:var(--muted)}
.rest{margin:6px 0 0;padding-left:2em;font-size:.88rem}
table.order tr.xm td{background:var(--sunk)}
table.order tr.early td:first-child{box-shadow:inset 4px 0 var(--warn)}
input.mvto{width:4.2em;font:inherit;font-size:.8rem;padding:3px 5px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);margin-left:4px}
.addm{flex-direction:row;flex-wrap:wrap;align-items:center}
.addm select,.addm input[type=text],.addm input[type=number]{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 8px;max-width:100%}
.addm input[type=number]{width:5em}
.gapwarn{color:var(--warn);background:var(--warn-soft);border-radius:999px;padding:0 8px;font-weight:700}
.pool li .mv{margin-left:auto;font-size:.75rem;padding:2px 4px;border-radius:6px;border:1px solid var(--line);background:var(--surface);color:var(--muted);max-width:9em}

/* ---------- parsing ---------- */
function parseTable(text){
  text=text.replace(/\r\n?/g,"\n");
  if(text.indexOf("\t")>=0)return text.split("\n").map(l=>l.split("\t"));
  const rows=[];let row=[],cell="",q=false;
  for(let i=0;i<text.length;i++){const c=text[i];
    if(q){if(c==='"'){if(text[i+1]==='"'){cell+='"';i++}else q=false}else cell+=c}
    else if(c==='"')q=true;else if(c===","){row.push(cell);cell=""}
    else if(c==="\n"){row.push(cell);rows.push(row);row=[];cell=""}else cell+=c}
  row.push(cell);rows.push(row);return rows;
}
function normWeight(v){
  let s=String(v||"").normalize("NFKC").replace(/\s|kg|KG|Kg|級/g,"");
  if(/^86(\+|超)$/.test(s))s="86+";
  return WEIGHTS.includes(s)?s:null;
}
function isAce(v){const s=String(v||"").trim();if(!s)return false;return !/^(false|いいえ|なし|no|0|×)$/i.test(s)}
function parseImport(text){
  const rows=parseTable(text).filter(r=>r.some(c=>String(c).trim()!==""));
  let teamCol=2,firstCol=3,start=0;const warnings=[];
  const hi=rows.findIndex(r=>r.some(c=>/所属チーム/.test(c)));
  if(hi>=0){const h=rows[hi];teamCol=h.findIndex(c=>/所属チーム/.test(c));
    const f=h.findIndex(c=>/選手1氏名/.test(c));if(f>=0)firstCol=f;start=hi+1}
  const byTeam=new Map();
  rows.slice(start).forEach((r,ri)=>{
    const team=String(r[teamCol]||"").normalize("NFKC").replace(/\s+/g," ").trim();
    if(!team){warnings.push((start+ri+1)+"行目：所属チームが空欄のため読み飛ばしました");return}
    const list=[];
    for(let k=0;k<10;k++){
      const name=String(r[firstCol+k*3]||"").trim(),wraw=String(r[firstCol+k*3+1]||"").trim(),ace=r[firstCol+k*3+2];
      if(!name&&!wraw)continue;
      if(!name){warnings.push(team+"：選手"+(k+1)+"の氏名が空欄です（階級 "+wraw+"）");continue}
      const w=normWeight(wraw);
      if(!w){warnings.push(team+"：「"+name+"」の階級「"+(wraw||"空欄")+"」を読み取れませんでした");continue}
      list.push({id:rid("w"),name,team,weight:w,ace:isAce(ace)});
    }
    /* 10名超は二回に分けて回答する運用：同じ大学の回答は合算。同じ氏名が重複したら後の回答を採用 */
    const prev=byTeam.get(team)||[];
    list.forEach(w=>{
      const i=prev.findIndex(x=>x.name.replace(/\s/g,"")===w.name.replace(/\s/g,""));
      if(i>=0){warnings.push(team+"：「"+w.name+"」が重複して回答されています。後の回答（"+wtext(w.weight)+"）を採用しました");prev[i]=w}
      else prev.push(w);
    });
    byTeam.set(team,prev);
  });
  const wrestlers=[...byTeam.values()].flat();
  const key=new Map();
  wrestlers.forEach(w=>{if(w.ace){const k=w.team+"|"+w.weight;key.set(k,(key.get(k)||0)+1)}});
  key.forEach((c,k)=>{if(c>1){const[t,w]=k.split("|");warnings.push(t+"："+wtext(w)+"でエースが"+c+"名います（各階級1名の想定）")}});
  return{wrestlers,warnings,teams:byTeam.size};
}

/* ---------- draw ---------- */
function poolPenalty(pool,byId){
  const t={};let aces=0;pool.forEach(id=>{const w=byId[id];t[w.team]=(t[w.team]||0)+1;if(w.ace)aces++});
  let teamPairs=0;Object.values(t).forEach(c=>teamPairs+=pairs(c));
  return teamPairs*3+pairs(aces)*5;
}
function drawOnce(list,sizes){
  const pools=sizes.map(cap=>({cap,m:[]}));
  const teamCount={};list.forEach(w=>teamCount[w.team]=(teamCount[w.team]||0)+1);
  const aces=shuffle(list.filter(w=>w.ace)).sort((a,b)=>teamCount[b.team]-teamCount[a.team]);
  const others=shuffle(list.filter(w=>!w.ace)).sort((a,b)=>teamCount[b.team]-teamCount[a.team]);
  const place=w=>{let best=null,bs=Infinity;
    shuffle(pools).forEach(p=>{if(p.m.length>=p.cap)return;
      const same=p.m.filter(x=>x.team===w.team).length,ac=p.m.filter(x=>x.ace).length;
      const sc=same*100+(w.ace?ac*10:0)+p.m.length/p.cap;
      if(sc<bs){bs=sc;best=p}});
    best.m.push(w)};
  aces.forEach(place);others.forEach(place);
  return pools.map(p=>shuffle(p.m).map(w=>w.id));
}
function drawClass(list,sizes){
  if(sizes.length<=1)return[shuffle(list).map(w=>w.id)];
  const byId=Object.fromEntries(list.map(w=>[w.id,w]));
  let best=null,bs=Infinity;
  for(let i=0;i<300;i++){const r=drawOnce(list,sizes);const s=r.reduce((a,p)=>a+poolPenalty(p,byId),0);if(s<bs){bs=s;best=r;if(s===0)break}}
  return best;
}

/* ---------- data access ---------- */
/* 大会の並び：回数（edition）→作成日の順。既定では最新の大会を開く */
function tSort(a,b){const x=S.tournaments[a]||{},y=S.tournaments[b]||{};return((x.edition||0)-(y.edition||0))||(x.createdAt||"").localeCompare(y.createdAt||"")}
function cur(){return S.currentId?S.tournaments[S.currentId]:null}
function clone(o){return JSON.parse(JSON.stringify(o))}
/* Firestoreは配列の中の配列を保存できないため、大会の記録は丸ごと文字列にして保存する */
function packT(body){return{j:JSON.stringify(body),updatedAt:body.updatedAt||new Date().toISOString()}}
function unpackT(d){return d&&typeof d.j==="string"?JSON.parse(d.j):d}
let chain=Promise.resolve();
function save(t){
  t.updatedAt=new Date().toISOString();
  S.tournaments[t.id]=t;renderAll();
  if(!S.db)return;
  const body=clone(t);delete body.id;
  chain=chain.then(()=>S.db.collection("tournaments").doc(t.id).set(packT(body))).catch(e=>{
    if(e&&e.code==="permission-denied"){toast("保存できませんでした。管理者用URLで開き直してください")}
    else if(e&&e.code==="resource-exhausted")toast("無料枠の上限に達しました。しばらく待ってからもう一度操作してください");
    else toast("保存に失敗しました。通信状態を確認して、もう一度操作してください");
  });
}
function edit(fn){const t=cur();if(!t||S.readOnly)return;const c=clone(t);fn(c);save(c)}
function removeTournament(id){
  delete S.tournaments[id];
  if(S.currentId===id){S.currentId=Object.keys(S.tournaments)[0]||null;store("platon.current",S.currentId||"")}
  renderAll();
  if(S.db)chain=chain.then(()=>S.db.collection("tournaments").doc(id).delete()).catch(()=>toast("削除に失敗しました"));
}
function newTournament(name,wrestlers){

}

  const teams=["見本大学","試運転大学","練習大学","模擬大学","仮置大学","例題大学","検証大学","下見大学"];
  const sur=["佐藤","鈴木","高橋","田中","伊藤","渡辺","山本","中村","小林","加藤","吉田","山田","佐々木","山口","松本","井上","木村","清水","山崎","森"];

function byClass(t){const g={};WEIGHTS.forEach(w=>g[w]=[]);(t?t.wrestlers:[]).forEach(w=>{if(w.withdrawn)return;(g[w.weight]||(g[w.weight]=[])).push(w)});return g}

/* ---------- formats, merges, blocks ---------- */
function blockInfo(classes,g,t){
  if(classes.length===1){const w=classes[0],f=fmtOf(t,w,g[w].length),st=classStats(f);
    return{fmt:f,st,pools:f.sizes.map(z=>({cls:w,size:z})),perClass:{[w]:{min:st.min,max:st.max}}}}
  const N=classes.reduce((a,w)=>a+g[w].length,0);
  if(N>5){const key=classes.slice().sort((a,b)=>WEIGHTS.indexOf(a)-WEIGHTS.indexOf(b)).join("+"),f=fmtOf(t,key,N),st=classStats(f);const perClass={};classes.forEach(w=>perClass[w]={min:st.min,max:st.max});
    return{mix:true,key,N,fmt:f,st,perClass,pools:f.sizes.map(z=>({cls:key,size:z}))}}
  /* 合同が5人以下：両階級をまとめた単一リーグ（全員総当たり）、順位は同じ階級同士の対戦で決める */const st={total:pairs(N),min:N-1,max:N-1};const perClass={};
  classes.forEach(w=>perClass[w]={min:N-1,max:N-1});
  return{merged:true,N,st,perClass,pools:[{cls:"merged",size:N}]};
}
function verdict(r){return r.min>=3?'<span class="ok">'+rangeText(r)+'</span>':'<span class="ng">'+rangeText(r)+'</span>'}
function validMerges(t,g){
  const m=(t&&t.merges)||{},out={},used=new Set();
  WEIGHTS.forEach((x,i)=>{const y=m[x];if(!y||used.has(x)||used.has(y))return;
    const j=WEIGHTS.indexOf(y);if(Math.abs(i-j)!==1||!g[x].length||!g[y].length)return;
    out[x]=y;used.add(x);used.add(y)});
  return out;
}
function partnerOf(w,mg){if(mg[w])return mg[w];const k=Object.keys(mg).find(x=>mg[x]===w);return k||null}
function blocks(t,g){
  const mg=validMerges(t,g),seen=new Set(),out=[];
  WEIGHTS.forEach(w=>{if(!g[w].length||seen.has(w))return;const p=partnerOf(w,mg);
    const cls=p?[w,p].sort((a,b)=>WEIGHTS.indexOf(a)-WEIGHTS.indexOf(b)):[w];cls.forEach(c=>seen.add(c));out.push(cls)});
  return out;
}
function classFmt(w,g,t){
  const n=g[w].length;if(n===0)return"登録なし";
  const mg=validMerges(t,g),p=partnerOf(w,mg);
  if(p){const info=blockInfo([w,p],g,t);if(info.mix)return esc(wtext(p))+"と合同（"+info.N+"名）・"+esc(fmtLabel(info.fmt))+"・"+verdict(info.perClass[w]);return esc(wtext(p))+"と合同・"+info.N+"人リーグ・"+verdict(info.perClass[w])}
  if(n===1)return"対戦相手がいません";
  const info=blockInfo([w],g,t);return esc(fmtLabel(info.fmt))+"・"+verdict(info.perClass[w]);
}
function renderStrip(){
  const t=cur(),g=byClass(t);
  $("classstrip").innerHTML=WEIGHTS.map(w=>{const n=g[w].length;
    return '<div class="cls" data-empty="'+(n===0)+'"><span class="w">'+wlabel(w)+'</span><span class="n"><b class="num">'+n+'</b> 名</span><span class="fmt">'+classFmt(w,g,t)+'</span></div>'}).join("");
}
function renderMerge(){
  const t=cur(),el=$("mergeOut");
  if(!t||!t.wrestlers.length){el.innerHTML="";return}
  const g=byClass(t),mg=validMerges(t,g);
  const small=WEIGHTS.filter(w=>(g[w].length>=1&&g[w].length<=3)||mg[w]);
  if(!small.length){el.innerHTML="";return}
  let h='<div class="card"><div><h2>少人数階級の合同</h2><p class="small muted">3名以下の階級は、合同後が5名以下になる場合に限り、隣の階級と一つのリーグにまとめて全員総当たりにできます。順位は同じ階級の選手同士の対戦結果で決めます。合同できない3名の階級は、3人リーグで決着を付けます（1人2試合）。</p></div>';
  small.forEach(x=>{

    if(asPartner){h+='<div class="small muted">'+esc(wtext(asPartner))+'の合同先になっています。変更する場合は'+esc(wtext(asPartner))+'の欄で選び直してください。</div></div>';return}
    const cands=[[WEIGHTS[i-1],"下"],[WEIGHTS[i+1],"上"]].filter(c=>c[0]);

    const ok=cands.filter(c=>avail(c[0]));
    let rec=null;ok.forEach(c=>{if(!rec||g[c[0]].length<g[rec].length||(g[c[0]].length===g[rec].length&&c[1]==="上"))rec=c[0]});
    const curv=mg[x]||"none";

    h+='<label class="opt"><input type="radio" name="m-'+esc(x)+'" value="none"'+(curv==="none"?" checked":"")+(S.readOnly?" disabled":"")+'><span class="t">合同しない</span><span class="d">'+esc(fmtLabel(solo.fmt))+'・'+verdict(solo.perClass[x])+'</span></label>';
    cands.forEach(([y,dir])=>{
      const can=avail(y);let d;
      if(!g[y].length)d="この階級は登録がありません";
      else if(n+g[y].length>5)d="合同すると"+(n+g[y].length)+"名になり、5名を超えるため選べません";
      else if(!can)d=esc(wtext(partnerOf(y,mg)))+"と合同済みのため選べません";
      else{const info=blockInfo([x,y],g,t);d=(n+g[y].length)+"人リーグ・全員"+info.st.min+"試合・計"+info.st.total+"試合"}
      h+='<label class="opt"'+(can?"":' aria-disabled="true"')+'><input type="radio" name="m-'+esc(x)+'" value="'+esc(y)+'"'+(curv===y?" checked":"")+(can&&!S.readOnly?"":" disabled")+'><span class="t">'+dir+'の'+esc(wtext(y))+'（'+g[y].length+'名）と合同'+(y===rec?'<span class="rec">人数が少ない方</span>':"")+'</span><span class="d">'+d+'</span></label>';
    });
    h+='</div></div>';
  });
  el.innerHTML=h+'</div>';
  el.querySelectorAll('input[type=radio]').forEach(r=>r.onchange=()=>{const x=r.name.slice(2);
    edit(t=>{t.merges=t.merges||{};if(r.value==="none")delete t.merges[x];else t.merges[x]=r.value});
    toast(r.value==="none"?wtext(x)+"は単独で行います":wtext(x)+"を"+wtext(r.value)+"と合同にしました")});
}

/* ---------- 前回優勝者の出場制限：前回大会で優勝した階級には出場できない ---------- */
function prevTournament(t){if(!t||!t.edition)return null;let best=null;Object.keys(S.tournaments).forEach(id=>{const x=S.tournaments[id];if(x.edition&&x.edition<t.edition&&(!best||x.edition>best.edition))best=x});return best}
async function loadChamps(){
  const t=cur();if(!t)return;const p=prevTournament(t);const sig=t.id+"|"+(p?p.id+":"+(p.updatedAt||""):"");
  if(S.champ&&S.champ.sig===sig)return;S.champ={sig,map:{},prev:{},name:p?p.name:""};if(!p)return;
  const R=await resultsOf(p.id);const saved=S.results;S.results=R;
  try{const C=computeAll(p);const map={};Object.keys(p.awards||{}).forEach(w=>{const x=p.wrestlers.find(y=>y.id===p.awards[w][0]);if(x)map[normKey(x.name,x.team)]=w});Object.keys(C.final).forEach(w=>{const F=C.final[w];if(F&&F.done&&F.places[0]){const x=p.wrestlers.find(y=>y.id===F.places[0]);if(x)map[normKey(x.name,x.team)]=w}});
    /* 前回の順位（全員分）：選手一覧などで「前回○kg級○位」と出す */
    const prev={};Object.keys(C.final).filter(w=>!isPair(w)).forEach(w=>{const F=C.final[w];if(F&&F.done)F.places.forEach((id,i)=>{const x=p.wrestlers.find(y=>y.id===id);if(x)prev[normKey(x.name,x.team)]={w,place:i+1}})});
    Object.keys(map).forEach(k=>{if(!prev[k])prev[k]={w:map[k],place:1}});
    S.champ={sig,map,prev,name:p.name}}
  finally{S.results=saved}
  renderAll();
}
function champBan(x){if(!S.champ||!x)return null;const w=S.champ.map[normKey(x.name,x.team)];return w&&w===x.weight?w:null}
/* 選手名の横の印：下の階級から上げて出場（↑）、前回の順位（all=falseなら3位以内だけ） */
function tags(x,o){o=o||{};if(!x)return"";let h="";const base=x.fromWeight||x.baseWeight;
  if(base&&base!==x.weight)h+='<span class="pill up" title="'+esc(wtext(base))+'の選手が上の階級に出場">↑'+esc(wtext(base))+'から</span>';
  else if(o.ctx&&isPair(o.ctx)&&clsOf(o.ctx)[0]===x.weight)h+='<span class="pill up" title="'+esc(wtext(x.weight))+'の選手（上の階級の選手とも対戦）">↑'+esc(wtext(x.weight))+'</span>';

function renderDraw(){

      all.map(x=>'<li><span class="wtag" style="font-size:.75rem">'+wlabel(x.cls)+'</span><b>'+esc(x.name)+'</b><span class="team">'+esc(x.team)+'</span>'+(x.ace?'<span class="ace">エース</span>':"")+'</li>').join("")+'</ol></div></div></div>';
  }).join("");
  $("btnDrawAll").disabled=S.readOnly||pending===0;

function gapAlert(idx){
  const t=cur();if(!t||!t.schedule)return;const C=computeAll(t),G=t.schedule.G||settingsOf(t).gap,o=t.schedule.order,gp=liveGaps(o,C,schPS(t));
  const byId=Object.fromEntries(t.wrestlers.map(x=>[x.id,x]));const fm=C.byKey[mkey(o[idx])],p=fm?C.parts(fm):o[idx].ws;
  const bad=[];if(gp[idx]&&gp[idx].vg!=null&&gp[idx].vg<G)bad.push("No."+(idx+1)+"（前の出番から"+gp[idx].gap+"試合）");
  if(p)for(let j=idx+1;j<o.length;j++){const f2=C.byKey[mkey(o[j])],p2=f2?C.parts(f2):o[j].ws;if(p2&&p2.some(id=>p.includes(id))){if(gp[j].vg!=null&&gp[j].vg<G)bad.push("No."+(j+1)+"（"+gp[j].gap+"試合）");break}}
  if(gp[idx]&&gp[idx].early)bad.push("No."+(idx+1)+"は予選リーグが終わる前です");
  if(bad.length)setTimeout(()=>toast("注意：間隔が目標（"+G+"試合）未満です "+bad.join("、")),400);
}

/* ---------- ④ 結果入力と順位 ----------
   勝ち点（日本レスリング協会 第41条）：フォール・負傷・コーション3回・不戦・失格 5:0／テクニカルスペリオリティ 4:0（敗者に得点あり 4:1）／判定 3:0（同 3:1）／両者失格など 0:0
   リーグ順位（国際ルール 第8条）：勝利数 → 2人が同数なら直接対決 → 3人以上は 勝ち点・フォール勝ち数・テクニカルスペリオリティ勝ち数・総得点・総失点の少なさ・抽選順 */
const WIN_TYPES=[["VFA","フォール"],["VSU","テクニカルスペリオリティ"],["VPO","判定（ポイント差）"],["VCA","コーション3回"],["VIN","負傷"],["VFO","不戦"],["DSQ","失格"],["2DSQ","両者失格・両者不戦"],["NC","未実施（棄権などで行わず）"]];
const typeName=c=>(WIN_TYPES.find(x=>x[0]===c)||[c,c])[1];
function cpOf(r){if(!r||r.type==="2DSQ"||r.w==null)return[0,0];const L=1-r.w,ls=r.lp!=null?!!r.lp:(r.s&&+r.s[L]>0);let a=5,b=0;
  if(r.type==="VSU"){a=4;b=ls?1:0}else if(r.type==="VPO"){a=3;b=ls?1:0}const o=[0,0];o[r.w]=a;o[L]=b;return o}
/* 試合の識別キー。表記を変えても記録が外れないよう、区分名の「同士」は旧表記「どうし」に揃えてから作る */
function mkey(m){return m.k==="X"?"X:"+m.xid:m.k==="L"?"L:"+m.cls+":"+m.ws.slice().sort().join("-"):"P:"+m.cls+":"+String(m.part).replace(/同士/g,"どうし")+":"+m.labels.join("-")}
function rkey(m){return"r"+hash(mkey(m))}
function getRes(m){return S.results[rkey(m)]||null}
function standings(ids,games){
  const st={};ids.forEach((id,i)=>st[id]={id,idx:i,w:0,l:0,cp:0,fall:0,su:0,tp:0,tc:0,played:0});
  games.forEach(g=>{if(!g.r||g.r.type==="NC")return;const cp=cpOf(g.r),sc=g.r.s||[0,0];

  const crit=(x,y)=>(y.cp-x.cp)||(y.fall-x.fall)||(y.su-x.su)||(y.tp-x.tp)||(x.tc-y.tc);
  const cmp=(x,y)=>crit(x,y)||(x.idx-y.idx);
  const arr=Object.values(st).sort((x,y)=>y.w-x.w),out=[];
  for(let i=0;i<arr.length;){let j=i;while(j<arr.length&&arr[j].w===arr[i].w)j++;const grp=arr.slice(i,j);
    /* 2人なら直接対決。3人以上は勝ち点などで比べ、それでも2人だけが並んだ所は直接対決で決める */
    grp.sort(grp.length===2?((x,y)=>h2h(x.id,y.id)||cmp(x,y)):cmp);

/* 予選の順位から順位決定戦の対戦者を自動で当てはめ、階級の最終順位まで出す */
function computeAll(t){
  const g=byClass(t),bl=blocks(t,g),{M}=buildMatches(t);const byKey={};M.forEach(m=>byKey[mkey(m)]=m);
  const slot={},pools={},final={};
  const lg=(lm,ids)=>lm.filter(m=>ids.includes(m.ws[0])&&ids.includes(m.ws[1])).map(m=>({a:m.ws[0],b:m.ws[1],r:getRes(m)}));
  bl.forEach(cls=>{
    if(cls.length>1&&!isMix(cls,g)){const lm=M.filter(m=>(m.k==="L"||(m.k==="X"&&m.count))&&m.cls===cls.join("+"));
      cls.forEach(w=>{const ids=g[w].map(x=>x.id),games=lg(lm,ids),table=standings(ids,games),done=games.every(x=>x.r);
        final[w]={merged:cls,table,done,places:done?table.map(s=>s.id):[]}});return}
    const w=cls.join("+");if(listOf(g,w).length<2||!drawValid(t,w))return;
    const P=t.draw[w].pools.filter(p=>p.length),lm=M.filter(m=>(m.k==="L"||(m.k==="X"&&m.count))&&m.cls===w);
    pools[w]=P.map((ids,i)=>{const games=lg(lm,ids);let table=standings(ids,games);const done=games.every(x=>x.r);
      const po=t.poolOrder&&t.poolOrder[w]&&t.poolOrder[w][i];/* 手動で決めた組内順位（記録の取り込み・審判の判断用） */
      if(po&&po.length===table.length&&po.every(id=>table.some(s=>s.id===id)))table=po.map(id=>table.find(s=>s.id===id));
      if(done)table.forEach((s,k)=>slot[w+"|"+i+"|"+(k+1)]=s.id);return{ids,games,table,done}});
  });
  const parts=m=>{
    if(m.k==="L"||m.k==="X")return m.ws;
    if(m.dep){const sf=m.dep.map(id=>M.find(x=>x.id===id));const pr=sf.map(s=>{const p=parts(s),r=getRes(s);return p&&r&&r.w!=null&&r.type!=="2DSQ"?{win:p[r.w],lose:p[1-r.w]}:null});
      if(pr.some(x=>!x))return null;return m.part==="決勝"?[pr[0].win,pr[1].win]:[pr[0].lose,pr[1].lose]}
    const ids=m.keys.map(k=>slot[k]);return ids.every(Boolean)?ids:null};
  Object.keys(pools).forEach(w=>{
    const ps=pools[w],f=fmtOf(t,w,listOf(g,w).length),pm=M.filter(m=>m.k==="P"&&m.cls===w);
    if(ps.length===1){final[w]={table:ps[0].table,done:ps[0].done,places:ps[0].done?ps[0].table.map(s=>s.id):[],tiers:ps[0].done?ps[0].table.map(s=>[s.id]):[]};return}
    if(!ps.every(p=>p.done)){final[w]={done:false,places:[],pending:"予選リーグの結果待ち"};return}
    const maxR=Math.max(...f.sizes),places=[],tiers=[];let done=true;
    const statOf=id=>{for(const p of ps){const s=p.table.find(x=>x.id===id);if(s)return s}};
    for(let r=1;r<=maxR;r++){const mem=rankGroup(f.sizes,r).map(i=>slot[w+"|"+i+"|"+r]),mode=f.place[r];
      if(mode==="ko"){const fm=pm.find(m=>m.part==="決勝"),tm=pm.find(m=>m.part==="3位決定戦"&&m.dep);
        const fp=parts(fm),tp=parts(tm),fr=getRes(fm),tr=getRes(tm);
        if(fp&&tp&&fr&&tr&&fr.w!=null&&tr.w!=null){const o=[fp[fr.w],fp[1-fr.w],tp[tr.w],tp[1-tr.w]];places.push(...o);o.forEach(x=>tiers.push([x]))}else{done=false;break}}
      else if(mode==="league"){const ms=pm.filter(m=>m.r===r&&!m.dep&&!m.part.startsWith("準決勝"));
        const games=ms.map(m=>{const p=parts(m);return p?{a:p[0],b:p[1],r:getRes(m)}:null});
        if(games.some(x=>!x||!x.r)){done=false;break}const o=standings(mem,games).map(s=>s.id);places.push(...o);o.forEach(x=>tiers.push([x]))}
      else{places.push(...mem.slice().sort((a,b)=>{const x=statOf(a),y=statOf(b);return(y.w-x.w)||(y.cp-x.cp)||(y.fall-x.fall)||(y.su-x.su)||(y.tp-x.tp)||(x.tc-y.tc)}));tiers.push(mem.slice())}}
    final[w]={done,places:done?places:places.slice(0,0),partial:places,tiers:done?tiers:[],pending:done?"":"順位決定戦の結果待ち"};
  });
  /* 合同（6名以上）の階級別順位：合同の順位の段（決勝の勝者・敗者…、同じ予選順位同士）ごとに、その階級の選手を並べる。
     同じ段に同じ階級の選手が複数いれば ①直接対決 ②1試合当たりの平均勝ち点 ③それでも同じなら順位決定戦が必要 */
  const byW={};t.wrestlers.forEach(x=>byW[x.id]=x.weight);
  const allRes=[];M.forEach(m=>{const p=parts(m),r=getRes(m);if(p&&r&&r.type!=="NC")allRes.push({p,r})});
  const avgCp=id=>{let sum=0,n=0;allRes.forEach(({p,r})=>{const k=p.indexOf(id);if(k<0)return;n++;sum+=cpOf(r)[k]});return n?sum/n:0};
  const h2h=(a,b)=>{let v=0;allRes.forEach(({p,r})=>{if(p.includes(a)&&p.includes(b)&&r.w!=null&&r.type!=="2DSQ")v=p[r.w]===a?-1:1});return v};
  Object.keys(final).filter(isPair).forEach(key=>{const F=final[key];
    clsOf(key).forEach(c=>{
      if(!F.done){final[c]={mixed:key,done:false,places:[],pending:F.pending||"予選リーグの結果待ち"};return}
      const places=[],need=[];
      F.tiers.forEach(tier=>{const mem=tier.filter(id=>byW[id]===c);if(!mem.length)return;
        mem.sort((a,b)=>(mem.length===2?h2h(a,b):0)||(avgCp(b)-avgCp(a)));
        if(mem.length>2)for(let i=0;i<mem.length-1;i++){if(avgCp(mem[i])===avgCp(mem[i+1])&&h2h(mem[i],mem[i+1])>0){const x=mem[i];mem[i]=mem[i+1];mem[i+1]=x}}
        for(let i=0;i<mem.length-1;i++){if(places.length+i<3&&avgCp(mem[i])===avgCp(mem[i+1])&&h2h(mem[i],mem[i+1])===0)need.push([mem[i],mem[i+1]])}
        places.push(...mem)});
      final[c]={mixed:key,done:!need.length,places:need.length?[]:places,partial:places,need,pending:need.length?"順位決定戦が必要":""};
    })});
  return{M,byKey,parts,pools,final};
}

/* ---------- 選手一覧：予定試合数・勝敗・勝ち点・次の試合・順位を選手ごとに ---------- */
function playerInfo(t,C){
  const g=byClass(t),mg=validMerges(t,g),info={},st=settingsOf(t),start=toMin(st.start),per=+st.per||0;
  t.wrestlers.forEach(x=>info[x.id]={w:0,l:0,cp:0,done:0,plan:null,next:null,poolRank:null,place:null});
  C.M.forEach(m=>{const p=C.parts(m),r=getRes(m);if(!p||!r)return;const cp=cpOf(r);
    p.forEach((id,k)=>{const s=info[id];if(!s)return;s.done++;s.cp+=cp[k];if(r.w===k&&r.type!=="2DSQ")s.w++;else s.l++})});
  WEIGHTS.forEach(w0=>{const list=g[w0];if(!list.length)return;const p=partnerOf(w0,mg);const w=p?[w0,p].sort((a,b)=>WEIGHTS.indexOf(a)-WEIGHTS.indexOf(b)).join("+"):w0;
    if(p&&!C.pools[w]){const N=list.length+g[p].length;list.forEach(x=>info[x.id].plan=[N-1,N-1])}
    else if(C.pools[w]){const f=fmtOf(t,w,listOf(g,w).length);
      const add=r=>{const m=f.place[r];if(!m)return 0;return m==="ko"?2:rankGroup(f.sizes,r).length-1};
      C.pools[w].forEach((pl,i)=>{const n=pl.ids.length;
        pl.ids.forEach(id=>{const s=info[id];if(pl.done){const r=pl.table.findIndex(z=>z.id===id)+1;s.poolRank=(C.pools[w].length>1?String.fromCharCode(65+i)+"組":"")+r+"位";s.plan=[n-1+add(r),n-1+add(r)]}
          else{let a=99,b=0;for(let r=1;r<=n;r++){const v=n-1+add(r);a=Math.min(a,v);b=Math.max(b,v)}s.plan=[a,b]}})})}
    const F=C.final[w0];if(F&&F.done)F.places.forEach((id,i)=>{if(info[id])info[id].place=i+1});
  });
  (t.extras||[]).forEach(e=>[e.a,e.b].forEach(id=>{const s=info[id];if(s&&s.plan)s.plan=s.plan.map(v=>v+1)}));
  const ET=t.schedule?eta(t,C):null;
  if(t.schedule)t.schedule.order.forEach((o,i)=>{const m=C.byKey[mkey(o)];if(!m||getRes(m))return;const p=C.parts(m);if(!p)return;
    p.forEach(id=>{const s=info[id];if(s&&!s.next)s.next={no:i+1,time:ET.times[i]==null?"":hm(ET.times[i])}})});
  return info;
}
/* ---------- 選手の戦績：氏名と大学名が一致する選手を、全ての大会から集める ---------- */
const normKey=(n,tm)=>String(n||"").normalize("NFKC").replace(/\s+/g,"")+"|"+String(tm||"").normalize("NFKC").replace(/\s+/g,"");
const resCache={};
async function resultsOf(id){
  if(id===S.currentId)return S.results;
  if(resCache[id])return resCache[id];
  if(!S.db)return{};
  try{const snap=await S.db.collection("tournaments/"+id+"/results").get();const r={};snap.docs.forEach(d=>{if(d.exists)r[d.id]=d.data()});resCache[id]=r;return r}catch(e){return{}}
}
function historyIn(t,R,key){
  const x=t.wrestlers.find(y=>normKey(y.name,y.team)===key);if(!x)return null;
  const saved=S.results;S.results=R;let out;
  try{
    const C=computeAll(t),byId=Object.fromEntries(t.wrestlers.map(y=>[y.id,y])),noOf={};
    if(t.schedule)t.schedule.order.forEach((o,i)=>noOf[mkey(o)]=i+1);
    const games=[];C.M.forEach(m=>{const p=C.parts(m);if(!p||!p.includes(x.id))return;const j=p.indexOf(x.id),r=getRes(m),op=byId[p[1-j]]||{};
      let res="未実施",cls="";if(r&&r.type!=="NC"){if(r.type==="2DSQ"){res="両者敗";cls="lose"}else if(r.w===j){res="勝ち";cls="win"}else{res="負け";cls="lose"}}else if(!r)res="これから";
      const cp=r&&r.type!=="NC"?cpOf(r):null;
      games.push({no:noOf[mkey(m)]||null,part:m.part,op:op.name||"",team:op.team||"",res,cls,type:r&&r.type!=="NC"?typeName(r.type):"",cp:cp?cp[j]+":"+cp[1-j]:""})});
    games.sort((a,b)=>(a.no||999)-(b.no||999));
    const F=C.final[x.weight];const place=F&&F.done?F.places.indexOf(x.id)+1:0;
    out={t,x,games,place,w:games.filter(g=>g.cls==="win").length,l:games.filter(g=>g.cls==="lose").length};
  }finally{S.results=saved}
  return out;
}

/* ---------- 閲覧用と管理者用の切り替え ----------
   閲覧用URL：対戦表・試合順・選手一覧・写真共有だけを表示し、何も変更できない
   管理者用URL：閲覧用URLの末尾に「#合言葉」を付けたもの。合言葉そのものは保存せず、照合用の値だけを保存する
   ※本当の書き込み制限はFirestoreのルールで掛かる（合言葉が一致した端末だけ admins に登録され、書き込める） */
const ART_URL="https://platoncup.github.io/platon-cup/";
async function sha(txt){try{const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode("platon:"+txt));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}catch(e){return"f"+hash("platon:"+txt)+hash(txt+":platon")}}
function newToken(){const c="abcdefghijkmnpqrstuvwxyz23456789",a=new Uint32Array(20);crypto.getRandomValues(a);return[...a].map(x=>c[x%c.length]).join("")}
function urlToken(){const h=(location.hash||"").replace(/^#/,"");return/^[a-z0-9]{12,}$/.test(h)?h:null}
/* 画面の切り替えは開いたURLだけで決める。合言葉付きのURLで開いた時だけ、この端末を管理者として登録する */
async function checkAdmin(){
  if(S.local){S.admin=true;return}
  S.admin=false;const tk=urlToken();if(!tk||!S.db||!S.uid)return;
  try{await S.db.doc("admins/"+S.uid).set({token:tk,at:new Date().toISOString()});S.admin=true;S.adminToken=tk;S.adminHash=true}catch(e){S.admin=false}
}
/* 最初の1回だけ：#setup で開くと合言葉を作り、管理者用URLへ切り替える（作成済みなら何もしない） */
function alertBox(msg){S.alertMsg=msg;renderMode();toast(msg)}
async function firstSetup(){
  /* この端末が既に管理者なら、今の管理者用URLへ切り替えるだけ */
  try{const me=await S.db.doc("admins/"+S.uid).get();if(me.exists){const k=await S.db.doc("secret/admin").get();if(k.exists){history.replaceState(null,"",location.pathname+"#"+k.data().token);return true}}}catch(e){}
  const tk=newToken();
  try{await S.db.doc("secret/admin").set({token:tk,at:new Date().toISOString()})}
  catch(e){alertBox("初期設定ができませんでした（"+(e&&e.code||e)+"）。既に設定済みの場合は、管理者用URLで開いてください。");return false}
  history.replaceState(null,"",location.pathname+"#"+tk);return true
}

async function issueAdminUrl(){
  if(!S.db||!S.admin)return;
  const tk=newToken();
  try{
    await S.db.doc("secret/admin").set({token:tk,at:new Date().toISOString()});
    await S.db.doc("admins/"+S.uid).set({token:tk,at:new Date().toISOString()});
    const snap=await S.db.collection("admins").get();await Promise.all(snap.docs.filter(d=>d.id!==S.uid).map(d=>d.ref.delete()));
    S.adminToken=tk;history.replaceState(null,"",location.pathname+"#"+tk);renderAccess();toast("管理者用URLを作り直しました。以前の管理者用URLは使えなくなりました");
  }catch(e){toast("作り直せませんでした。通信状態を確認してください")}
}

async function importData(t,results,replace){
  const id=t.id,body=clone(t);delete body.id;const col=S.db.collection("tournaments/"+id+"/results");
  if(replace){const old=await col.get();for(const d of old.docs)if(!(d.id in results))await d.ref.delete()}
  await S.db.collection("tournaments").doc(id).set(packT(body));
  const ks=Object.keys(results);for(let i=0;i<ks.length;i+=400){const b=S.db.batch();ks.slice(i,i+400).forEach(k=>b.set(col.doc(k),clone(results[k])));await b.commit()}
  if(id===S.currentId){S.resFor=null;ensureResSub()}
}
/* ---------- 最終結果：全階級の1〜3位と全順位、大学別のメダル数 ---------- */
function renderFinal(){
  const t=cur(),out=$("finalOut");if(!out)return;
  if(!t||!t.wrestlers.length){out.innerHTML='<div class="empty"><h3>まだ結果はありません</h3></div>';return}
  const g=byClass(t),C=computeAll(t),byId=Object.fromEntries(t.wrestlers.map(x=>[x.id,x]));

  const AW=t.awards||{};Object.keys(AW).forEach(w=>{if(!C.final[w]||!C.final[w].done)C.final[w]={done:true,award:true,places:AW[w].slice()}});
  const cls=WEIGHTS.filter(w=>g[w].length>1||(C.final[w]));const doneN=cls.filter(w=>C.final[w]&&C.final[w].done).length;
  const teams={};
  cls.forEach(w=>{const F=C.final[w];if(!F||!F.done)return;F.places.slice(0,3).forEach((id,i)=>{const x=byId[id];if(!x)return;const tm=teams[x.team]=teams[x.team]||{g:0,s:0,b:0};tm[["g","s","b"][i]]++})});
  const trows=Object.entries(teams).sort((a,b)=>(b[1].g-a[1].g)||(b[1].s-a[1].s)||(b[1].b-a[1].b)||a[0].localeCompare(b[0],"ja"));
  let h='<div class="card"><div class="row between"><div><h2>最終結果</h2><p class="small muted">'+esc(t.name)+'</p></div><div class="sumfig"><span class="small muted">順位確定</span><b class="num">'+doneN+' / '+cls.length+' 階級</b></div></div></div>';

    if(F.award){const x=byId[F.places[0]]||{};return'<div class="card fcard"><div class="row between"><span class="wtag">'+wlabel(w)+'</span><span class="pill" data-s="done">確定</span></div><ol class="podium"><li class="p1"><span class="pos">1</span><span class="pn"><b>'+esc(x.name||"")+'</b>'+(x.ace?'<span class="star">★</span>':'')+'<small>'+esc(x.team||"")+'</small></span></li></ol><p class="small muted">出場者1名のため不戦優勝（試合は'+esc(wtext(x.weight||""))+'に出場）</p></div>'}
    let c='<div class="card fcard"><div class="row between"><span class="wtag">'+wlabel(w)+'</span>'+(F.merged?'<span class="small muted">'+esc(F.merged.map(wtext).join("＋"))+' 合同</span>':F.mixed?'<span class="small muted">'+esc(wlab(F.mixed))+' 合同</span>':'')+'<span class="pill" data-s="'+(F.done?"done":"")+'">'+(F.done?"確定":F.need&&F.need.length?"順位決定戦が必要":"試合中")+'</span></div>';
    if(F.done){c+='<ol class="podium">'+F.places.slice(0,3).map((id,i)=>{const x=byId[id]||{};return'<li class="p'+(i+1)+'"><span class="pos">'+(i+1)+'</span><span class="pn"><b>'+esc(x.name||"")+'</b>'+(x.ace?'<span class="star">★</span>':'')+'<small>'+esc(x.team||"")+'</small></span></li>'}).join("")+'</ol>';
      if(F.places.length>3)c+='<details><summary class="small">4位以下</summary><ol class="rest" start="4">'+F.places.slice(3).map(id=>{const x=byId[id]||{};return'<li>'+esc(x.name||"")+' <small class="muted">'+esc(x.team||"")+'</small></li>'}).join("")+'</ol></details>'}
    else{const ck=F.mixed||(F.merged&&F.merged.join("+")),total=C.M.filter(m=>m.cls===w||m.cls===ck).length,done=C.M.filter(m=>(m.cls===w||m.cls===ck)&&getRes(m)).length;
      if(F.need&&F.need.length)c+='<p class="small">順位決定戦：'+F.need.map(([a,b])=>esc((byId[a]||{}).name)+' 対 '+esc((byId[b]||{}).name)).join("、")+'</p>';
      c+='<p class="small muted">'+(total?'試合 '+done+' / '+total+' 終了':'組み合わせ未作成')+'</p>'}
    return c+'</div>'}).join("")+'</div>';

  if(!name||!team){toast("氏名と所属チームを入力してください");return}
  edit(t=>t.wrestlers.push({id:rid("w"),name,team,weight:$("addWeight").value,ace:$("addAce").checked}));
  $("addName").value="";$("addAce").checked=false;$("addName").focus();toast(name+"を追加しました")};
$("btnDrawAll").onclick=()=>{const t=cur();if(!t)return;const g=byClass(t);doDraw(blocks(t,g).map(c=>c.length===1?c[0]:isMix(c,g)?c.join("+"):null).filter(Boolean),true)};

store("platon.admintoken","");
const savedTab=store("platon.tab");if(["draw","order","res","players","bracket","final","photos"].includes(savedTab))S.tab=savedTab;
if(location.hash&&!urlToken()&&["roster","draw","order","res","players","bracket","final","photos"].includes(location.hash.slice(1)))S.tab=location.hash.slice(1);
renderAll();

/* ---------- boot：Firebase（誰でもサインインなしで閲覧。書き込みは合言葉付きURLの端末だけ） ---------- */
(async function(){
  if(!window.firebase){S.local=true;renderAll();return}
  firebase.initializeApp({apiKey:"AIzaSyBtD_7hourQsH_fq0S5GS0TRWdyYqLh2wE",authDomain:"platon-cup.firebaseapp.com",projectId:"platon-cup",storageBucket:"platon-cup.firebasestorage.app",messagingSenderId:"1088877175521",appId:"1:1088877175521:web:e1f66fd20e5babf1f4cda0"});
  const db=firebase.firestore();try{db.settings({ignoreUndefinedProperties:true})}catch(e){}
  S.db=db;S.local=false;applyMode();renderAll();
  try{const cred=await firebase.auth().signInAnonymously();S.uid=cred.user.uid}catch(e){alertBox("接続（匿名ログイン）に失敗しました（"+(e&&e.code||e)+"）。ページを開き直してください。")}
  if(location.hash==="#setup"&&S.uid)await firstSetup();
  await checkAdmin();applyMode();
  if(S.admin){try{const k=await db.doc("secret/admin").get();if(k.exists)S.adminToken=k.data().token}catch(e){}}
  const want=store("platon.current");let first=true;
  db.collection("tournaments").onSnapshot(snap=>{
    const next={};snap.docs.forEach(d=>{if(d.exists)next[d.id]=Object.assign(clone(unpackT(d.data())),{id:d.id})});
    S.tournaments=next;if(first){first=false;S.seedable=S.admin&&!snap.docs.length&&!!window.PLATON_SEED}else if(snap.docs.length)S.seedable=false;
    if(!S.currentId||!next[S.currentId])S.currentId=(want&&next[want])?want:(Object.keys(next).sort((a,b)=>tSort(b,a))[0]||null);
    renderAll();
  },e=>{toast("データの読み込みが止まりました。ページを開き直してください")});
  renderAll();
})();
})();
</script>
